name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: supportpilot
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: supportpilot_secret
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Build and Test Suite
        working-directory: backend
        run: |
          ./mvnw clean test \
            -DDB_HOST=localhost \
            -DDB_PORT=5434 \
            -DDB_NAME=supportpilot \
            -DDB_USER=supportpilot \
            -DDB_PASSWORD=supportpilot_secret

  console:
    name: Console Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Install Dependencies
        working-directory: console
        run: npm ci

      - name: Run Component Tests (Vitest)
        working-directory: console
        run: npm test

      - name: Run ESLint
        working-directory: console
        run: npm run lint

      - name: Production Build
        working-directory: console
        run: npm run build
