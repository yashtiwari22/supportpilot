server:
  port: ${PORT:8080}

spring:
  application:
    name: supportpilot-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:supportpilot}?stringtype=unspecified
    username: ${DB_USER:supportpilot}
    password: ${DB_PASSWORD:supportpilot_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

supportpilot:
  auth:
    jwt:
      secret: ${JWT_SECRET:demo_insecure_jwt_secret_key_minimum_32_bytes_long!}
      expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  llm:
    provider: ${LLM_PROVIDER:mock}
    mock:
      latency-min-ms: 100
      latency-max-ms: 300
      failure-rate: 0.0
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
  queue:
    type: ${QUEUE_TYPE:postgres}
    concurrency: ${QUEUE_CONCURRENCY:4}
    poll-interval-ms: ${QUEUE_POLL_INTERVAL_MS:500}
    visibility-timeout-seconds: ${QUEUE_VISIBILITY_TIMEOUT_SECONDS:60}
    max-retries: 3
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      topic-tickets: ${KAFKA_TOPIC_TICKETS:supportpilot.tickets}
      group-id: ${KAFKA_GROUP_ID:supportpilot-workers}
  ratelimit:
    enabled: true
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.supportpilot: ${LOG_LEVEL:INFO}
