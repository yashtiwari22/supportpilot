services:
  - type: web
    name: supportpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        sync: false # Set to Neon DB hostname
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: supportpilot
      - key: DB_USER
        sync: false # Set to Neon DB username
      - key: DB_PASSWORD
        sync: false # Set to Neon DB password
      - key: LLM_PROVIDER
        value: gemini # or mock
      - key: GEMINI_API_KEY
        sync: false # Free Google AI Studio API key
      - key: JWT_SECRET
        generateValue: true
      - key: QUEUE_TYPE
        value: postgres
